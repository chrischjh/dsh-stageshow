name: Release

on:
  push:
    tags: ['v*']

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: Publish to npm (needs NPM_TOKEN secret)
        if: env.NPM_TOKEN != ''
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release with the packed tarball
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-stageshow-*.tgz
          body: Install with Plugins → Add plugin, or the tarball / github:chrischjh/dsh-stageshow spec.
